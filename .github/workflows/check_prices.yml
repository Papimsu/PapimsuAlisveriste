name: 7/24 Amazon Price & Glitch Checker

on:
  schedule:
    # Saatte 2 kez (her saatin 07. ve 37. dakikası) = günde 48 = ayda ~1.440 dk (2.000 dk ücretsiz kotanın altında).
    # :00 yerine :07/:37 seçildi çünkü GitHub'da :00 en yoğun dakikadır ve çalışmalar gecikir/atlanır.
    # NOT: Aralık değişirse tracker.py içindeki CHECK_INTERVAL_MIN de güncellenmeli.
    - cron: '7,37 * * * *'
  workflow_dispatch: # Elle tetikleme

permissions:
  contents: write # Repoya güncel fiyatları yazabilme izni

# Aynı anda iki kontrol çalışıp birbirinin kaydını ezmesin
concurrency:
  group: price-checker
  cancel-in-progress: false

jobs:
  check-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Pip paketlerini önbelleğe alır, her turda tekrar internetten indirmez

      - name: Bağımlılıkları Yükle
        run: |
          pip install -r requirements.txt

      - name: Fiyatları Kontrol Et & Telegram Bildirimi Gönder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "-1004357390519"
        run: |
          python tracker.py

      - name: Güncellenen Fiyatları Depoya Kaydet (Çakışma ve Bozuk JSON Korumalı)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add watchlist.json status.json
          if git diff --staged --quiet; then
            echo "Değişiklik yok."
            exit 0
          fi
          git commit -m "Auto: Update checked prices"
          for i in 1 2 3; do
            if git pull --rebase origin main; then
              # Birleştirme sonrası JSON bozulduysa ASLA push etme (Telegram'dan eklenen ürünler korunur)
              if python -c "import json; json.load(open('watchlist.json', encoding='utf-8'))"; then
                if git push origin main; then
                  echo "Kaydedildi."
                  exit 0
                fi
              else
                echo "Birleştirme sonrası watchlist.json geçersiz! Bu turun güncellemesi atlanıyor."
                git reset --hard origin/main
                exit 0
              fi
            else
              git rebase --abort || true
              echo "Telegram'dan eş zamanlı değişiklik var; bu turun güncellemesi atlanıyor, bir sonraki turda yazılacak."
              git reset --hard origin/main
              exit 0
            fi
            sleep 3
          done
          echo "Push 3 denemede başarısız, bir sonraki turda yazılacak."
