name: 7/24 Amazon Price & Glitch Checker

on:
  schedule:
    # Her 15 dakikada bir otomatik çalışır
    - cron: '*/15 * * * *'
  workflow_dispatch: # Elle tetikleme

permissions:
  contents: write # Repoya güncel fiyatları yazabilme izni

jobs:
  check-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları Yükle
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fiyatları Kontrol Et & Telegram Bildirimi Gönder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python tracker.py

      - name: Güncellenen Fiyatları Depoya Kaydet (Git Commit)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add watchlist.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Update checked prices" && git push)
